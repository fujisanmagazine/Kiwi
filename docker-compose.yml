version: '2'

services:
    db:
        container_name: kiwi_db
        image: mariadb:latest
        command:
            --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
        volumes:
            - ./db_data_bind:/var/lib/mysql
        restart: always
        environment:
            # checkov:skip=CKV_SECRET_6:Base64 High Entropy String
            MYSQL_ROOT_PASSWORD: kiwi-1s-aw3s0m3
            MYSQL_DATABASE: kiwi
            MYSQL_USER: kiwi
            MYSQL_PASSWORD: kiwi
            TZ: Asia/Tokyo

    web:
        container_name: kiwi_web
        depends_on:
            - db
        restart: always
        image: registry.fms-dev.com/kiwitcms/kiwi:latest
        ports:
            - 80:8080
            - 443:8443
        volumes:
            - ./uploads_bind:/Kiwi/uploads:Z
            - ./custom_nginx.conf:/Kiwi/etc/nginx.conf:Z
            - ./local_settings.py:/venv/lib/python3.11/site-packages/tcms/settings/local_settings.py:Z
        environment:
            KIWI_DB_HOST: db
            KIWI_DB_PORT: 3306
            KIWI_DB_NAME: kiwi
            KIWI_DB_USER: kiwi
            KIWI_DB_PASSWORD: kiwi
            TZ: Asia/Tokyo
            KIWI_TIME_ZONE: Asia/Tokyo
            KIWI_REGISTRATION_ENABLED: False
        cap_drop:
          - ALL
